<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" fill="none">
  <defs>
    <!-- Rich 24K Metallic Gold Gradient -->
    <linearGradient id="altierGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA9E5A" />
      <stop offset="25%" stop-color="#FDF3CD" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#FFF0BE" />
      <stop offset="100%" stop-color="#996D2D" />
    </linearGradient>

    <!-- Warm Champagne Gold Accent -->
    <linearGradient id="altierGoldSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7233" />
      <stop offset="50%" stop-color="#E5C378" />
      <stop offset="100%" stop-color="#F9E8B6" />
    </linearGradient>

    <!-- Subtle Glow Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Emblem Group -->
  <g transform="translate(4, 2)">
    <!-- Outer Diamond Framework -->
    <path 
      d="M30 4 L56 30 L30 56 L4 30 Z" 
      stroke="url(#altierGold)" 
      stroke-width="1.25" 
      fill="none" 
      opacity="0.85"
    />
    
    <!-- Concentric Inner Diamond Accent -->
    <path 
      d="M30 9 L51 30 L30 51 L9 30 Z" 
      stroke="url(#altierGoldSoft)" 
      stroke-width="0.75" 
      stroke-dasharray="2 2"
      fill="none" 
      opacity="0.6"
    />

    <!-- Stylized Haute Couture 'A' Monogram -->
    <!-- Left Leg -->
    <path 
      d="M30 14 L18 45" 
      stroke="url(#altierGold)" 
      stroke-width="2.5" 
      stroke-linecap="round"
    />
    <!-- Right Leg -->
    <path 
      d="M30 14 L42 45" 
      stroke="url(#altierGold)" 
      stroke-width="2.5" 
      stroke-linecap="round"
    />
    <!-- Needle Thread Crossbar Loop -->
    <path 
      d="M20 34 C25 31, 35 31, 40 34" 
      stroke="url(#altierGold)" 
      stroke-width="1.8" 
      stroke-linecap="round"
    />
    <path 
      d="M17 37 C24 40, 36 40, 43 37" 
      stroke="url(#altierGoldSoft)" 
      stroke-width="1" 
      stroke-linecap="round"
      opacity="0.9"
    />

    <!-- Top Crown Star Sparkle -->
    <g transform="translate(30, 14)">
      <circle cx="0" cy="0" r="1.75" fill="url(#altierGold)" />
      <path d="M0 -5 L0 5 M-5 0 L5 0" stroke="url(#altierGold)" stroke-width="0.8" opacity="0.8" />
    </g>

    <!-- Base Diamond Drop Accent -->
    <polygon points="30,49 32,52 30,55 28,52" fill="url(#altierGold)" />
  </g>

  <!-- Typography / Brand Wordmark -->
  <g transform="translate(74, 34)">
    <!-- Primary Name: ALTIER -->
    <text 
      x="0" 
      y="0" 
      font-family="'Playfair Display', Georgia, serif" 
      font-size="24" 
      font-weight="500" 
      letter-spacing="0.22em" 
      fill="url(#altierGold)"
    >
      ALTIER
    </text>

    <!-- Subtitle: MAISON PRIVÉE -->
    <text 
      x="1" 
      y="15" 
      font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
      font-size="8" 
      font-weight="600" 
      letter-spacing="0.42em" 
      fill="#D4AF37" 
      opacity="0.85"
    >
      MAISON PRIVÉE
    </text>

    <!-- Editorial Accent Hairline -->
    <line 
      x1="0" 
      y1="20" 
      x2="152" 
      y2="20" 
      stroke="url(#altierGoldSoft)" 
      stroke-width="0.5" 
      opacity="0.45" 
    />
  </g>
</svg>

